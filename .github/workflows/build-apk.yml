name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico de archivos del repositorio
        run: |
          echo "== Manifiestos encontrados =="
          find . -iname "androidmanifest*" -not -path "./.git/*"
          echo "== Contenido de app/src/main =="
          ls -la app/src/main || true
          echo "== Archivos del proyecto =="
          find . -type f -not -path "./.git/*" | sort | head -60

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Mostrar errores de compilación
        if: failure()
        run: grep -nE "^e: |What went wrong|error:|FAILED" -A3 build.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoYesFinance-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build.log
